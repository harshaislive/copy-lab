  - id: "post_10"
    position: 10
    angle: "digital_declaration"
    hook: "This is not a digital detox. It's a digital declaration."
    body: |
      I'm not leaving technology.
      I'm choosing it.

      Intentionally.
      On my terms.
      For my purposes.

      The 10% lifestyle:
      - Technology serves me, not the reverse
      - My attention is mine to allocate
      - Boredom is a feature, not a bug
      - Creation beats consumption
      - Presence beats performance

      This isn't about going back.
      It's about going forward — with awareness.

      What's your 10% declaration?
