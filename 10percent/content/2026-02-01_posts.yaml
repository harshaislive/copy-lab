  - id: "post_08"
    position: 8
    angle: "digital_boundaries"
    hook: "Your phone has no boundaries. You must create them."
    body: |
      Apps are designed to be infinitely engaging.
      They have no stopping cues.

      Remember when TV shows ended? When albums had sides?

      Infinite scroll removed the natural break.

      Your boundaries must be intentional:
      - App time limits
      - Phone-free zones (bedroom, dinner table)
      - Digital sunset (no screens after 9pm)

      It feels restrictive at first.
      Then liberating.

      What boundary would most improve your life?
    hashtags: ["#Boundaries", "#DigitalWellness", "#Habits"]
    linkedin_url: ""
    engagement:
