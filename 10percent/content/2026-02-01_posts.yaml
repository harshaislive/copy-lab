theme: "The Silence We Forgot"
golden_thread:
  narrative_arc: "Your nervous system was designed for stillness. Modern life is sensory assault. 10% time in nature resets the system."
  open_questions:
    - "What would happen if you didn't check your phone for an hour?"
    - "When did you last feel truly quiet?"
    - "What are you afraid you'd feel in silence?"

tone_profile:
  conversational: 85
  confrontational: 20
  poetic: 50
  actionable: 40

posts:
  - id: "post_01"
    position: 1
    angle: "nature_prescription"
    hook: "Rewilding isn't just for wolves."
    body: |
      Doctors in Scotland can now prescribe nature.

      Not as a nice-to-have. As medicine.

      Because they've measured what happens when humans stop:
      - The cortisol drop
      - The attention restoration
      - The nervous system remembering what 'off' feels like

      We're not built for constant stimulation.
      We're built for rhythms:
      - Light and dark
      - Activity and rest
      - Connection and solitude

      What would 10% of your week look like if you treated it as essential?
    hashtags: ["#Rest", "#Burnout", "#NatureDeficit"]
    linkedin_url: ""
