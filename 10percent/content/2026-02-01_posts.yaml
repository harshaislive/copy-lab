  - id: "post_03"
    position: 3
    angle: "creation_vs_consumption"
    hook: "You're either the creator or the product."
    body: |
      Social platforms don't sell connections.
      They sell your attention to advertisers.

      The more you consume, the more valuable you become.

      But there's a flip side:

      When you create instead of consume, you break the cycle.
      - Write instead of scroll
      - Build instead of browse
      - Connect instead of compare

      The 10% lifestyle isn't about deprivation.
      It's about choosing what you feed your mind.

      What did you create today?
    hashtags: ["#CreatorEconomy", "#DigitalDetox", "#Productivity"]
    linkedin_url: ""
    engagement:
      impressions: 0
