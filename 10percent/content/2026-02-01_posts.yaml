  - id: "post_05"
    position: 5
    angle: "rewilding_self"
    hook: "The weird thing about 'balance' is..."
    body: |
      We treat it like a scale.
      Work on one side. Life on the other.

      But what if it's not about balance?
      What if it's about biology?

      Your body doesn't know from "work-life balance."
      It knows:
      - Stress hormones
      - Natural light
      - Movement
      - Silence

      You can't negotiate with your nervous system.
      You can only feed it what it needs.

      What's one thing your body is asking for that you've been ignoring?
    hashtags: ["#Stress", "#BurnoutRecovery", "#Wellness"]
