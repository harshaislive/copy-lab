  - id: "post_09"
    position: 9
    angle: "generational_shift"
    hook: "Your grandparents' stress relief was the front porch."
    body: |
      Not an app.
      Not a subscription.
      Just... sitting.

      Watching light change.
      Hearing birds without naming them.
      Being bored without reaching for a screen.

      We've gained so much technology.
      We've lost so much silence.

      What would your grandmother tell you about rest?
