  - id: "post_07"
    position: 7
    angle: "weekend_recovery"
    hook: "Monday morning isn't a reset. It's a reckoning."
    body: |
      You know the pattern:

      Exhausted by Friday.
      Recover Saturday.
      Anxious Sunday evening.
      Repeat.

      We treat weekends like recovery from work.
      But what if work didn't require recovery?

      The 10% lifestyle isn't about weekends.
      It's about designing a life that doesn't deplete you.

      Small changes compound:
      - One screen-free hour daily
      - Nature exposure weekly
      - Real connection regularly

      What would sustainable look like for you?
    hashtags: ["#WorkLifeBalance", "#BurnoutPrevention", "#Wellness"]
    linkedin_url: ""
