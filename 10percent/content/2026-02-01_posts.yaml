  - id: "post_06"
    position: 6
    angle: "modern_paradox"
    hook: "Your body thinks it's being chased by a lion. It's actually just email."
    body: |
      The average person touches their phone 96 times daily.

      That's every 10 minutes of waking life.

      We invented washing machines to save 6 hours a week. Then filled that time with scrolling.

      The brain needs boredom to process. Silence to consolidate memories.

      What would happen if you just... didn't? For an hour. A day.

      What are you afraid you'd feel?
    hashtags: ["#NatureRx", "#ForestBathing", "#Healing"]
