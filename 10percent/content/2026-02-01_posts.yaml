theme: "Digital Minimalism"
golden_thread:
  narrative_arc: "We traded presence for productivity. The 10% lifestyle is about reclaiming attention in a distracted world."
  open_questions:
    - "What would you create if you weren't consuming?"
    - "How much of your day is reactive vs intentional?"
    - "What are you saying no to when you say yes to scroll?"

tone_profile:
  conversational: 80
  confrontational: 30
  poetic: 45
  actionable: 65

posts:
  - id: "post_01"
    position: 1
    angle: "attention_reclamation"
    hook: "Your focus is being auctioned to the highest bidder."
    body: |
      Every app on your phone is designed to capture and keep your attention.

      Not because they care about you.
      Because attention is the currency of the digital economy.

      The average person:
      - Checks phone 96 times daily
      - Spends 2.5 hours on social media
      - Switches apps 89 times per day

      That's not usage. That's extraction.

      What would your life look like if you reclaimed just 10% of that time?
    hashtags: ["#DigitalMinimalism", "#Attention", "#IntentionalLiving"]
    linkedin_url: ""
    engagement:
