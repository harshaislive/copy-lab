  - id: "post_02"
    position: 2
    angle: "notification_anxiety"
    hook: "The red dot is not your friend."
    body: |
      That little badge number creates a psychological itch.

      It doesn't matter what's behind it.
      What matters is that you don't know.

      This is called "variable reward" — the same mechanism that makes slot machines addictive.

      Try this: Turn off all badge notifications for one day.

      Not the apps. Just the red dots.

      Notice what happens to your anxiety levels.
    hashtags: ["#DigitalWellness", "#Mindfulness", "#MentalHealth"]
    linkedin_url: ""
