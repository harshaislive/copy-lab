  - id: "post_05"
    position: 5
    angle: "social_comparison"
    hook: "You're comparing your behind-the-scenes to everyone else's highlight reel."
    body: |
      The problem with social media isn't the time it takes.
      It's the story it tells.

      Everyone's launching, succeeding, living their best life.
      While you're... sitting in traffic. Again.

      What you don't see:
      - The failures
      - The doubts
      - The ordinary Tuesdays

      Comparison is automatic.
      Contentment is intentional.

      What if you took a week off from watching other people's lives?
    hashtags: ["#Comparison", "#MentalHealth", "#Authenticity"]
    linkedin_url: ""
    engagement:
