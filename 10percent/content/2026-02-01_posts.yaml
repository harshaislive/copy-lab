  - id: "post_09"
    position: 9
    angle: "presence_practice"
    hook: "You're missing your life while documenting it."
    body: |
      We used to experience moments.
      Now we curate them.

      The sunset.
      The conversation.
      The ordinary magic.

      All filtered through: "Is this shareable?"

      Try this experiment:
      One day without posting.
      Without checking likes.
      Without the performance.

      Just: Be where you are.
      With who you're with.
      Doing what you're doing.

      The 10% lifestyle starts with being present for your own life.
    hashtags: ["#Presence", "#Mindfulness", "#IntentionalLiving"]
    linkedin_url: ""
    engagement:
