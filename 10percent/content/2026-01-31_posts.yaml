theme: "The Permission to Rest"
golden_thread:
  narrative_arc: "From recognizing exhaustion to claiming rest as productive"
  open_questions:
    - "What would you notice about your life from 100 feet away?"
    - "When's the last time you heard a sound you didn't need to identify?"
    - "What's your 10% today?"

