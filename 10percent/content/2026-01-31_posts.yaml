theme: Land as Living Memory
date: '2026-01-31'
golden_thread:
  narrative_arc: From viewing land as asset to understanding it as relationship
  open_questions:
  - What would your grandchildren thank you for planting?
  - Which tree would you want to watch grow for 50 years?
  - What does stewardship actually look like day-to-day?
tone_profile:
  conversational: 85
  confrontational: 15
  poetic: 40
  actionable: 60
posts:
- id: post_01
  position: 1
  angle: generational_stewardship
  hook: You know that tired feeling that sleep doesn't fix?
  body: 'You get 8 hours. Maybe 9 on weekends.


    But there''s this background hum that never quite goes away.


    It''s not your fault.


    Our nervous systems were designed for environments where stillness was the default,
    not the exception.


    Now? Our brains process 34 gigabytes of information daily.


    What''s the last thing you heard that wasn''t man-made?'
