  - id: "post_10"
    position: 10
    angle: "creativity_space"
    hook: "The best ideas don't come in meetings."
    body: |
      They come:
      - On walks
      - In showers
      - During the space between tasks

      Your brain needs fallow time.
      Unstructured, unproductive, apparently "wasted" time.

      This isn't unprofessional.
      This is how creativity works.

      The 10% isn't about doing less work.
      It's about making space for the work to actually happen.

      When's your fallow time?
    hashtags: ["#Creativity", "#Rest", "#Productivity"]
