  - id: "post_02"
    position: 2
    angle: "generational_contrast"
    hook: "Your ancestors would be confused by your weekends."
    body: |
      Not judgmental. Just... confused.

      They spent 200,000 years figuring out:
      - Which plants heal
      - Which birds mean rain
      - Which silence means safety

      And now?

      We spend Saturdays recovering from the week.
      Sundays dreading the next one.

      The weird part: we call this "balance."

      What do you do on weekends that actually fills you back up?
    hashtags: ["#Weekend", "#Nature", "#SlowLiving"]
