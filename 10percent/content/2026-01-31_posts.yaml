  - id: "post_08"
    position: 8
    angle: "burnout_reframe"
    hook: "I used to think 'burnout' meant working too hard."
    body: |
      Now I think it means:

      Working in ways that don't fit how humans work.

      We evolved for:
      - Task → rest → task → rest
      - Clear boundaries between work and not-work
      - Seasons of intensity and seasons of recovery

      We built systems that demand:
      - Constant availability
      - Simultaneous everything
      - Infinite linear growth

      No wonder we're tired.

      The fix isn't a vacation.
      It's different architecture.

      What would your work week look like if it respected your biology?
    hashtags: ["#Burnout", "#WorkLife", "#HumanDesign"]
    linkedin_url: ""
    engagement:
      impressions: 0
      likes: 0
      comments: 0
      shares: 0
      click_throughs: 0

  - id: "post_09"
    position: 9
    angle: "overwhelm_framework"
    hook: "Three questions I ask when I'm overwhelmed:"
    body: |
      1. Is this urgent or just loud?
      2. Will this matter in a month?
      3. What would I do if I had 10% more energy?

      The third one is the cheat code.

      Because "10% more energy" isn't about sleeping more.
      It's about spending the energy you have differently.

      Sometimes the answer is: do less.
      Sometimes it's: do it somewhere else.
      Sometimes it's: stop doing it for other people's approval.

      What's your version of "10% more energy"?
    hashtags: ["#Overwhelm", "#EnergyManagement", "#10Percent"]
    linkedin_url: ""
    engagement:
