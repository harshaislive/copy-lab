  - id: "post_06"
    position: 6
    angle: "sensory_restoration"
    hook: "There's a sound you can't hear in cities."
    body: |
      Not silence.

      The opposite: *enough* sound.

      Birds layering on birds.
      Wind through different trees (each makes its own note).
      Water doing whatever water decides.

      Your brain knows what to do with this.

      It was built for it.

      In the city, your auditory cortex stays partially activated, waiting for the next alert, siren, notification.

      In the wild, it finally gets to do its actual job: listening without vigilance.

      When's the last time you heard a sound you didn't need to identify?
    hashtags: ["#NatureSounds", "#SensoryRest", "#Wilderness"]
    linkedin_url: ""
    engagement:
      impressions: 0
      likes: 0
      comments: 0
      shares: 0
      click_throughs: 0

  - id: "post_07"
    position: 7
    angle: "forest_bathing_science"
    hook: "The Japanese have a word: 'Shinrin-yoku.'"
    body: |
      Forest bathing.

      Not hiking.
      Not exercising.
      Just... being there.

      Studies show it lowers cortisol, blood pressure, and heart rate.

      But you don't need studies.

      You remember how you felt the last time you stood somewhere green and just... breathed.

      We don't lack evidence.
      We lack permission to slow down.

      So here: permission granted.

      What's the closest patch of green to where you are right now?
    hashtags: ["#ForestBathing", "#ShinrinYoku", "#Wellness"]
