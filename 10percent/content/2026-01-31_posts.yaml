  - id: "post_03"
    position: 3
    angle: "digital_habit_disruption"
    hook: "The average person checks their phone 96 times a day."
    body: |
      That's once every 10 minutes of being awake.

      Here's what I noticed:

      When I spend a weekend somewhere without signal, that number drops to about 6.

      Not because I'm disciplined.
      Because the option literally doesn't exist.

      That's the trick, isn't it?

      We don't need more willpower.
      We need different environments.

      When's the last time you were somewhere you *couldn't* check your phone?
    hashtags: ["#DigitalWellness", "#Unplug", "#NatureTherapy"]
    linkedin_url: ""
    engagement:
      impressions: 0
