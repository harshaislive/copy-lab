  - id: "post_04"
    position: 4
    angle: "reframe_retreat"
    hook: "I've been thinking about the word 'retreat.'"
    body: |
      We use it for:
      - Corporate offsites
      - Wellness weekends
      - Emergency military maneuvers

      Same word.
      Very different meanings.

      But they all share something:

      Stepping back to see the whole board.

      The question is: what are we stepping back *from*?

      If you can't name it, you might be too close to see it.

      What's one thing you'd notice about your life if you watched it from 100 feet away?
    hashtags: ["#Perspective", "#Retreat", "#Mindfulness"]
    linkedin_url: ""
    engagement:
      impressions: 0
      likes: 0
      comments: 0
      shares: 0
      click_throughs: 0

  - id: "post_05"
    position: 5
    angle: "define_10_percent"
    hook: "Someone asked me why we call it '10%.'"
    body: |
      Not 50%.
      Not all-in.
      Just 10%.

      Because that's the difference between:
      - Ordering takeout vs. growing tomatoes on your balcony
      - Netflix binge vs. walking after dinner
      - Dreaming about change vs. one small habit

      10% isn't a compromise.
      It's an entry point.

      You don't need to move to a forest.
      You need to remember forests exist.

      What's your 10% today?
    hashtags: ["#10Percent", "#SmallChanges", "#Nature"]
    linkedin_url: ""
    engagement:
      impressions: 0
      likes: 0
