<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10% Lifestyle | LinkedIn Content Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        @font-face {
            font-family: 'ABC Arizona Flare';
            src: url('https://isdbyvwocudnlwzghphw.supabase.co/storage/v1/object/public/web.images/fonts/ABCArizonaFlare-Light-Trial.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'ABC Arizona Flare', Georgia, serif;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 2rem;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #e0e0e0;
        }
        h1 { font-weight: 300; font-size: 2rem; margin-bottom: 0.5rem; }
        .meta { color: #666; font-size: 0.875rem; }
        .thread-info {
            background: #f0f0f0;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-left: 3px solid #333;
        }
        .thread-info h2 { font-weight: 300; font-size: 1.25rem; margin-bottom: 0.5rem; }
        .thread-info p { color: #555; font-size: 0.875rem; }
        .post-card {
            background: white;
            border: 1px solid #e0e0e0;
            margin-bottom: 1.5rem;
            padding: 2rem;
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #f0f0f0;
        }
        .post-number {
            font-size: 2rem;
            color: #ccc;
            font-weight: 300;
        }
        .post-meta {
            text-align: right;
        }
        .post-angle {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #666;
        }
        .post-status {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            margin-top: 0.5rem;
            display: inline-block;
        }
        .status-pending { background: #fff3cd; }
        .status-published { background: #d4edda; }
        .hook {
            font-size: 1.25rem;
            font-weight: 300;
            margin-bottom: 1rem;
            color: #1a1a1a;
        }
        .body-text {
            white-space: pre-wrap;
            margin-bottom: 1.5rem;
            color: #333;
        }
        .hashtags {
            color: #0066cc;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }
        .actions {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover { background: #333; }
        .linkedin-input {
            flex: 1;
            min-width: 300px;
            padding: 0.75rem;
            border: 1px solid #ddd;
            font-family: inherit;
        }
        .engagement-form {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f0f0f0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }
        .engagement-field label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
            margin-bottom: 0.25rem;
        }
        .engagement-field input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            font-family: inherit;
        }
        .score-display {
            margin-top: 1rem;
            padding: 1rem;
            background: #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .performance-high { color: #28a745; }
        .performance-med { color: #ffc107; }
        .performance-low { color: #dc3545; }
        .loading { text-align: center; padding: 3rem; color: #666; }
        .error { text-align: center; padding: 3rem; color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>10% Lifestyle</h1>
            <p class="meta">LinkedIn Content Dashboard | Golden Thread System</p>
        </header>

        <div id="content">
            <div class="loading">Loading posts...</div>
        </div>
    </div>

    <script>
        async function loadPosts() {
            try {
                const response = await fetch('./content/2026-01-31_posts.yaml');
                const yamlText = await response.text();
                const data = jsyaml.load(yamlText);
                
                renderDashboard(data);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('content').innerHTML = 
                    `<div class="error">Error loading posts: ${error.message}</div>`;
            }
        }

        function renderDashboard(data) {
            const container = document.getElementById('content');
            
            let html = `
                <div class="thread-info">
                    <h2>${data.theme}</h2>
                    <p><strong>Golden Thread:</strong> ${data.golden_thread.narrative_arc}</p>
                    <p style="margin-top: 0.5rem;"><strong>Open Threads:</strong> ${data.golden_thread.open_questions.join(', ')}</p>
                </div>
            `;

            data.posts.forEach(post => {
                const isPublished = post.linkedin_url && post.linkedin_url.length > 0;
                const statusClass = isPublished ? 'status-published' : 'status-pending';
                const statusText = isPublished ? 'Published' : 'Pending';
                
                html += `
                    <div class="post-card" id="post-${post.id}">
                        <div class="post-header">
                            <span class="post-number">${String(post.position).padStart(2, '0')}</span>
                            <div class="post-meta">
                                <div class="post-angle">${post.angle.replace(/_/g, ' ')}</div>
                                <div class="post-status ${statusClass}">${statusText}</div>
                            </div>
                        </div>
                        
                        <div class="hook">${post.hook}</div>
                        <div class="body-text">${post.body}</div>
                        <div class="hashtags">${post.hashtags.join(' ')}</div>
                        
                        <div class="actions">
                            <button class="btn" onclick="copyPost('${post.id}')">Copy Text</button>
                            <input type="text" 
                                   class="linkedin-input" 
                                   placeholder="Paste LinkedIn post URL here..."
                                   value="${post.linkedin_url || ''}"
                                   onchange="saveLinkedInUrl('${post.id}', this.value)">
                        </div>
                        
                        ${isPublished ? `
                        <div class="engagement-form">
                            <div class="engagement-field">
                                <label>Impressions</label>
                                <input type="number" value="${post.engagement?.impressions || ''}" 
                                       onchange="saveEngagement('${post.id}', 'impressions', this.value)">
                            </div>
                            <div class="engagement-field">
                                <label>Likes</label>
                                <input type="number" value="${post.engagement?.likes || ''}"
                                       onchange="saveEngagement('${post.id}', 'likes', this.value)">
                            </div>
                            <div class="engagement-field">
                                <label>Comments</label>
                                <input type="number" value="${post.engagement?.comments || ''}"
                                       onchange="saveEngagement('${post.id}', 'comments', this.value)">
                            </div>
                            <div class="engagement-field">
                                <label>Shares</label>
                                <input type="number" value="${post.engagement?.shares || ''}"
                                       onchange="saveEngagement('${post.id}', 'shares', this.value)">
                            </div>
                            <div class="engagement-field">
                                <label>CTR</label>
                                <input type="number" value="${post.engagement?.click_throughs || ''}"
                                       onchange="saveEngagement('${post.id}', 'click_throughs', this.value)">
                            </div>
                        </div>
                        
                        <div class="score-display">
                            <span>Performance Score: <strong>${calculateScore(post.engagement)}</strong></span>
                            <span class="${getPerformanceClass(post.engagement)}">${getPerformanceLabel(post.engagement)}</span>
                        </div>
                        ` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function copyPost(postId) {
            fetch('./content/2026-01-31_posts.yaml')
                .then(r => r.text())
                .then(text => {
                    const data = jsyaml.load(text);
                    const post = data.posts.find(p => p.id === postId);
                    if (post) {
                        const fullText = `${post.hook}\n\n${post.body}\n\n${post.hashtags.join(' ')}`;
                        navigator.clipboard.writeText(fullText);
                        alert('Post copied!');
                    }
                });
        }

        function saveLinkedInUrl(postId, url) {
            console.log('Save URL for', postId, url);
            // In production, this would save back to YAML
        }

        function saveEngagement(postId, metric, value) {
            console.log('Save engagement:', postId, metric, value);
            // In production, this would save back to YAML
        }

        function calculateScore(engagement) {
            if (!engagement) return 'N/A';
            // Simple engagement rate calculation
            const likes = engagement.likes || 0;
            const comments = engagement.comments || 0;
            const shares = engagement.shares || 0;
            const impressions = engagement.impressions || 1;
            
            const score = ((likes + comments * 2 + shares * 3) / impressions * 100).toFixed(1);
            return score + '%';
        }

        function getPerformanceClass(engagement) {
            if (!engagement) return '';
            const score = parseFloat(calculateScore(engagement));
            if (score > 5) return 'performance-high';
            if (score > 2) return 'performance-med';
            return 'performance-low';
        }

        function getPerformanceLabel(engagement) {
            if (!engagement) return 'No data';
            const score = parseFloat(calculateScore(engagement));
            if (score > 5) return 'High Performing';
            if (score > 2) return 'Average';
            return 'Needs Work';
        }

        loadPosts();
    </script>
</body>
</html>
